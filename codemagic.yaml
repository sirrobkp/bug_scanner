workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.example.bugScannerApp"
      flutter: stable
    scripts:
      - name: Flutter clean
        script: |
          flutter clean
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Install iOS dependencies (Pods)
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign
      - name: Create IPA
        script: |
          mkdir -p build/ios/ipa
          mkdir -p build/ios/iphoneos/Payload
          
          # Copy app bundle into Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          
          # Zip it up into the final IPA container
          cd build/ios/iphoneos
          zip -r ../ipa/Runner.ipa Payload
          cd ../../../
    artifacts:
      - build/ios/ipa/Runner.ipa
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - robertkapola92@gmail.com