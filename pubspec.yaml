name: bug_scanner_app
description: A bug scanner mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  camera: ^0.10.5+7
  permission_handler: ^11.0.1
  image: ^4.1.3
  network_info_plus: ^8.2.1
  sensors_plus: ^6.0.0
  flutter_blue_plus: ^1.32.0
  audioplayers: ^6.0.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"  

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/sounds/beep.wav